<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="LarpLess">
  <!-- Flat copy of the macOS app icon (larpless/macos/Focusline-macOS/AppIcon.icon): same layer SVGs, with the group's Icon Composer offset (0, -20) applied; the glass effects are left out. -->
  <style>
    .tile-top { stop-color: #ffffff; }
    .tile-bottom { stop-color: #ececee; }
    @media (prefers-color-scheme: dark) {
      .tile-top { stop-color: #3a3a3c; }
      .tile-bottom { stop-color: #1c1c1e; }
    }
  </style>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="tile-top"/>
      <stop offset="1" class="tile-bottom"/>
    </linearGradient>
    <linearGradient id="body-fill" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#5BC98F"/>
      <stop offset="1" stop-color="#2E9A69"/>
    </linearGradient>
    <path id="shape" d="M300,170 H724 A190,190 0 0 1 914,360 V570 A190,190 0 0 1 724,760 H300 A190,190 0 0 1 110,570 V360 A190,190 0 0 1 300,170 Z M432,700 H592 V850 H432 Z M352,812 H672 A40,40 0 0 1 712,852 A40,40 0 0 1 672,892 H352 A40,40 0 0 1 312,852 A40,40 0 0 1 352,812 Z M606,350 A48,48 0 0 0 558,398 V502 A48,48 0 0 0 606,550 A48,48 0 0 0 654,502 V398 A48,48 0 0 0 606,350 Z M770,350 A48,48 0 0 0 722,398 V502 A48,48 0 0 0 770,550 A48,48 0 0 0 818,502 V398 A48,48 0 0 0 770,350 Z"/>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#tile)"/>
  <g transform="translate(0 -20)">
    <use href="#shape" transform="translate(0 42)" fill="#1F6B4B"/>
    <use href="#shape" fill="url(#body-fill)"/>
    <path d="M250,300 A150,150 0 0 1 380,232" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="38" stroke-linecap="round"/>
  </g>
</svg>
