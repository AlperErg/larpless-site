# Netlify builds this repository's root (no base directory). Build with Vite and
# publish its output: public/ (home.webp, og.png…) is only copied to the web root
# by the build, and src/main.ts must be compiled before the browser can run it.
# The build fetches GUIDE.md, PRIVACY.md and TERMS.md from AlperErg/larpless, whose
# site-docs workflow calls a build hook when they change.
# Canonical, Open Graph, and sitemap URLs use Netlify's URL. Set SITE_URL when
# the public domain should differ from that origin.
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Umami analytics, served from this domain so ad blockers don't drop it.
# status 200 makes this a rewrite (proxy), not a redirect. Events go to
# /_v/api/send, handled by netlify/edge-functions/umami-send.js so Umami sees
# the visitor's location instead of the Netlify server's.
[[redirects]]
  from = "/_v/s.js"
  to = "https://cloud.umami.is/script.js"
  status = 200

# Everything the site loads comes from its own domain (fonts, video, Umami via
# /_v), so only same-origin scripts may run. This also keeps out Netlify's
# injected inline scripts, the "Powered by Netlify" badge among them. Inline
# style attributes stay allowed (index.html uses a few); JSON-LD isn't a script
# CSP blocks. Anything new from another domain has to be listed here.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
